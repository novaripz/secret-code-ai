<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif; }
    a { color: #ececec; } a:hover { color: #ffffff; }

    /* First run: the panda arrives and waves, then settles. */
    @keyframes logoRoll { to { transform: rotate(360deg) } }
    .logo-roll { animation: logoRoll 9s linear infinite; }

    @keyframes arrive { 0% { opacity: 0; transform: translateY(24px) scale(.86) } 60% { transform: translateY(-6px) scale(1.02) } 100% { opacity: 1; transform: none } }
    @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
    @keyframes wave { 0%,58%,100% { transform: rotate(-30deg) } 68% { transform: rotate(-58deg) } 78% { transform: rotate(-38deg) } 88% { transform: rotate(-54deg) } }
    @keyframes blink { 0%,93%,100% { transform: scaleY(1) } 96% { transform: scaleY(.06) } }
    @keyframes sway { 0%,100% { transform: rotate(-4deg) } 50% { transform: rotate(5deg) } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
    @keyframes caret { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    .arrive { animation: arrive .62s cubic-bezier(.22,1,.36,1) both; }
    .bob { animation: bob 3.2s ease-in-out infinite .7s; }
    .wave-arm { animation: wave 3.6s ease-in-out infinite; transform-origin: 150px 162px; }
    .eye { animation: blink 4.2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .bamboo { animation: sway 3.8s ease-in-out infinite; transform-origin: 155px 192px; }
    .rise { animation: rise .5s ease-out both; }
    .r1 { animation-delay: .18s } .r2 { animation-delay: .3s } .r3 { animation-delay: .42s } .r4 { animation-delay: .54s }
    .caret { animation: caret 1.05s step-end infinite; }

  </style>
</helmet>

<div style="display: flex; height: 900px; width: 1440px; background: #0d0d0d; color: #ececec; align-items: center; justify-content: center; overflow: hidden;">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 22px; width: 100%; max-width: 560px; padding: 0 24px;">

    <div class="arrive"><div class="bob">
      <svg viewBox="0 0 200 250" style="width: 176px; height: 220px;">
      <g class="bamboo">
        <rect x="150" y="112" width="11" height="80" rx="5" fill="#6aa84f"/>
        <rect x="150" y="136" width="11" height="4" fill="#4e7d3a"/>
        <rect x="150" y="164" width="11" height="4" fill="#4e7d3a"/>
        <ellipse cx="176" cy="116" rx="18" ry="7" fill="#8fbc6b" transform="rotate(-24 176 116)"/>
        <ellipse cx="137" cy="104" rx="16" ry="6" fill="#8fbc6b" transform="rotate(20 137 104)"/>
      </g>

      <!-- body, large; head overlaps it so there is no floating-head gap -->
      <ellipse cx="100" cy="180" rx="58" ry="60" fill="#fafafa"/>
      
      <ellipse cx="52" cy="176" rx="14" ry="23" fill="#1a1a1a" transform="rotate(20 52 176)"/>
      <ellipse class="wave-arm" cx="150" cy="168" rx="13" ry="23" fill="#1a1a1a" transform="rotate(-30 150 168)"/>
      <ellipse cx="76" cy="235" rx="17" ry="11" fill="#1a1a1a"/>
      <ellipse cx="124" cy="235" rx="17" ry="11" fill="#1a1a1a"/>

      <g class="ear-l"><circle cx="64" cy="54" r="17" fill="#1a1a1a"/><circle cx="64" cy="54" r="8" fill="#4a4a4a"/></g>
      <g class="ear-r"><circle cx="136" cy="54" r="17" fill="#1a1a1a"/><circle cx="136" cy="54" r="8" fill="#4a4a4a"/></g>

      <ellipse cx="100" cy="88" rx="47" ry="44" fill="#fafafa"/>
      
      <ellipse cx="82" cy="86" rx="14" ry="17" fill="#1c1c1c" transform="rotate(-14 82 86)"/>
      <ellipse cx="118" cy="86" rx="14" ry="17" fill="#1c1c1c" transform="rotate(14 118 86)"/>
      <g class="eye">
      <circle cx="82" cy="86" r="8.4" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
      <circle cx="79.1" cy="83.0" r="2.7" fill="#ffffff" opacity=".92"/>
      <circle cx="84.5" cy="88.9" r="1.2" fill="#ffffff" opacity=".45"/></g>
      <g class="eye">
      <circle cx="118" cy="86" r="8.4" fill="#000000" stroke="#3d3d3d" stroke-width="1"/>
      <circle cx="115.1" cy="83.0" r="2.7" fill="#ffffff" opacity=".92"/>
      <circle cx="120.5" cy="88.9" r="1.2" fill="#ffffff" opacity=".45"/></g>
      <ellipse cx="100" cy="106" rx="7.5" ry="5.5" fill="#1a1a1a"/>
      <path d="M100 111 L100 115" stroke="#1a1a1a" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M89 117 Q100 126 111 117" stroke="#1a1a1a" stroke-width="3.2" fill="none" stroke-linecap="round"/></svg>
    </div></div>

    <div class="rise r1" style="text-align: center;">
      <h1 style="margin: 0 0 8px; font-size: 30px; font-weight: 600; letter-spacing: -0.02em;">Hey, I&#39;m Pandai</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #b4b4b4; text-wrap: pretty;">Tell me a bit about you and I&#39;ll remember it in every chat from here on.</p>
    </div>

    <div class="rise r2" style="width: 100%; display: flex; flex-direction: column; gap: 18px; background: #171717; border: 1px solid #2a2a2a; border-radius: 20px; padding: 24px;">
      <div>
        <label style="display: block; margin-bottom: 7px; font-size: 13px; font-weight: 500;">What should I call you?</label>
        <div style="display: flex; align-items: center; background: #262626; border: 1px solid #3d3d3d; border-radius: 12px; padding: 11px 14px; font-size: 15px;">
          Jaden<span class="caret" style="display: inline-block; width: 2px; height: 18px; background: #ececec; margin-left: 2px;"></span>
        </div>
      </div>
      <div>
        <label style="display: block; margin-bottom: 7px; font-size: 13px; font-weight: 500;">Birthday</label>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
          <div style="background: #262626; border: 1px solid #2a2a2a; border-radius: 12px; padding: 11px 14px; font-size: 15px;">March</div>
          <div style="background: #262626; border: 1px solid #2a2a2a; border-radius: 12px; padding: 11px 14px; font-size: 15px;">14</div>
          <div style="background: #262626; border: 1px solid #2a2a2a; border-radius: 12px; padding: 11px 14px; font-size: 15px; color: #8a8a8a;">Year</div>
        </div>
        <p style="margin: 7px 0 0; font-size: 12px; color: #8a8a8a;">Year is optional, skip it if you would rather.</p>
      </div>
      <div>
        <label style="display: block; margin-bottom: 9px; font-size: 13px; font-weight: 500;">What are you into?</label>
        <div style="display: flex; flex-wrap: wrap; gap: 8px;"><span style="border-radius: 999px; background: #ececec; color: #0d0d0d; padding: 8px 14px; font-size: 13px; font-weight: 500;">Basketball</span><span style="border-radius: 999px; background: #ececec; color: #0d0d0d; padding: 8px 14px; font-size: 13px; font-weight: 500;">Music production</span><span style="border-radius: 999px; border: 1px solid #3d3d3d; padding: 8px 14px; font-size: 13px; color: #b4b4b4;">Gaming</span><span style="border-radius: 999px; border: 1px solid #3d3d3d; padding: 8px 14px; font-size: 13px; color: #b4b4b4;">Art</span><span style="border-radius: 999px; border: 1px solid #3d3d3d; padding: 8px 14px; font-size: 13px; color: #b4b4b4;">Coding</span><span style="border-radius: 999px; border: 1px solid #3d3d3d; padding: 8px 14px; font-size: 13px; color: #b4b4b4;">Anime</span><span style="border-radius: 999px; border: 1px dashed #3d3d3d; padding: 8px 14px; font-size: 13px; color: #8a8a8a;">+ add your own</span></div>
      </div>
    </div>

    <div class="rise r3" style="width: 100%; display: flex; align-items: center; gap: 14px;">
      <div style="flex: 1; height: 3px; border-radius: 999px; background: #262626; overflow: hidden;">
        <div style="height: 100%; width: 66%; border-radius: 999px; background: #ececec;"></div>
      </div>
      <span style="font-size: 12px; color: #8a8a8a; flex-shrink: 0;">Step 2 of 3</span>
    </div>

    <div class="rise r4" style="width: 100%; display: flex; align-items: center; gap: 12px;">
      <span style="flex: 1; text-align: center; border-radius: 14px; background: #ffffff; color: #0d0d0d; padding: 13px; font-size: 15px; font-weight: 600;">Continue</span>
      <span style="border-radius: 14px; border: 1px solid #3d3d3d; padding: 13px 20px; font-size: 15px; color: #b4b4b4;">Skip</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
